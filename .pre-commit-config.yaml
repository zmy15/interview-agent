# ============================================================================
# pre-commit 钩子配置
# ----------------------------------------------------------------------------
# 本地启用（提交前自动检查并修复）：
#     pip install pre-commit
#     pre-commit install
#
# 手动对全部文件跑一遍：
#     pre-commit run --all-files
#
# 更新钩子版本（保持 rev 为最新 tag）：
#     pre-commit autoupdate
#
# CI：本文件同时驱动 pre-commit.ci，无需额外配置。
# ============================================================================

default_language_version:
  python: python3

# 排除构建产物、缓存与第三方生成物，避免钩子误改非源码文件。
#
# 注意：tts_models/ 下的 .onnx.json 是 Piper 的语音模型配置（随仓库提交），
# 属生成物且体量大，不纳入格式类检查；但其 JSON 语法仍应可校验，
# 因此这里只排除「模型文件」，不排除整个目录。
exclude: |
  (?x)^(
    frontend/node_modules/.*|
    frontend/dist/.*|
    \.vite/.*|
    \.venv/.*|
    hf_cache/.*|
    chroma_data/.*|
    screenshots/.*|
    logs/.*|
    .*\.min\.(js|css)
  )$

repos:
  # ── 通用文件检查 ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      # JSON 校验
      #
      # 排除 JSONC（含注释的 JSON）—— 下面这些文件由各自的工具消费，
      # 本身就允许注释，删掉注释才能通过校验属于本末倒置：
      #   .vscode/settings.json   VS Code 原生支持注释
      #   tsconfig*.json          TypeScript 官方允许注释
      # package-lock.json 由 npm 生成，体量大且格式不受控，同样排除。
      - id: check-json
        exclude: |
          (?x)^(
            frontend/package-lock\.json|
            \.vscode/settings\.json|
            frontend/tsconfig.*\.json
          )$
      - id: check-toml
      - id: check-merge-conflict
      # 大文件拦截（默认只检查本次新增的文件，已提交的文件不受影响）。
      #
      # 排除随仓库提交的模型权重 —— 它们本就该在仓库里，只是体积大：
      #   stt_service/models/silero_vad.onnx   ~2.2MB（VAD 模型）
      #   tts_models/**/*.onnx                 ~60MB （Piper 语音模型）
      # 不加排除时，`pre-commit run --all-files` 会因它们而失败。
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: (\.onnx$|^tts_models/.*)$
      # 换行统一为 LF。仓库内文本本就以 LF 存储（见 .gitattributes），
      # 此钩子防止 Windows 下误提交 CRLF。
      #
      # 排除两类文件：
      #   .bat/.cmd     含中文且依赖 UTF-8 无 BOM + CRLF，
      #                 任何「规范化」都可能破坏 cmd 解析（详见 .gitattributes）
      #   tts_models/   Piper 语音模型与配置，属第三方生成物，不应改动
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: (\.(bat|cmd)|^tts_models/.*)$
      # 补齐文件末尾换行。同样排除 .bat/.cmd —— 理由同上，
      # 且 start_app.bat 历来无末尾换行，改它没有收益却引入风险。
      - id: end-of-file-fixer
        exclude: (\.(bat|cmd)|^tts_models/.*)$
      - id: trailing-whitespace
      # 私有密钥检测：.env 已被 .gitignore 排除，此处兜底防误提交
      - id: detect-private-key

  # ── Python 代码检查（ruff）──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      # 静态检查：--fix 自动修复可修复的问题（导入排序、未使用导入等）
      #
      # 注意：仅启用安全规则集（见 pyproject.toml 的 [tool.ruff.lint]）。
      # 未启用 ruff-format —— 它会重写 64/70 个 Python 文件（约 3.7 万行），
      # 与任何功能改动混在一起会让代码审查失去意义。
      # 如需统一格式，建议单独开一个只做格式化的提交，届时再启用：
      #     - id: ruff-format
      - id: ruff
        args: [--fix]

# ============================================================================
# pre-commit.ci 配置
# ----------------------------------------------------------------------------
# 在 https://pre-commit.ci 用 GitHub 账号登录并授权本仓库即可启用，
# 无需在此文件之外做任何设置。
#
# 行为说明：
#   - 每个 PR 自动运行钩子，并直接向 PR 提交修复（autofix）
#   - 每周一约 16:00 UTC 自动提交钩子版本升级 PR（autoupdate）
#   - 在 PR 中评论 `pre-commit.ci run`（单独一行）可重新触发
#   - 提交信息含 [skip ci] / [ci skip] / [skip pre-commit.ci] 时跳过
# ============================================================================
ci:
  autofix_commit_msg: |
    [pre-commit.ci] 自动修复

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] 自动更新 pre-commit 钩子版本"
  autoupdate_schedule: weekly
  # 本地钩子（如依赖未安装的工具）不适合在 CI 中运行；当前没有本地钩子，
  # 预留此位置以便后续按需跳过。
  skip: []
  submodules: false
